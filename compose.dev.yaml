name: campus-pass-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_dev_only
      POSTGRES_DB: campus
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - dev_database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campus -d campus']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  dev_database:
